<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareVeda - Needy Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        function doLogout() {
            localStorage.removeItem("activeuser");
            location.href = "/index.html";
        }
    </script>

   <style>

/* =========================
   CAREVEDA - NEedy DASHBOARD
   GLASSMORPHISM THEME
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:'Inter','Segoe UI',sans-serif;

    background:
        radial-gradient(circle at 10% 10%, rgba(20,184,166,.22), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(15,118,110,.20), transparent 35%),
        linear-gradient(135deg,#dff7f3,#edf8f7,#dcefeb);

    color:#134e4a;
}


/* =========================
   MAIN CONTAINER
========================= */

.container{
    background:rgba(255,255,255,.55);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.75);

    border-radius:28px;

    padding:28px;

    box-shadow:
        0 20px 50px rgba(15,118,110,.14);
}


/* =========================
   DASHBOARD HEADER
========================= */

.dashboard-header{

    padding:18px 22px;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            rgba(15,118,110,.95),
            rgba(20,184,166,.90)
        );

    color:white;

    box-shadow:
        0 12px 30px rgba(15,118,110,.25);
}


/* Heading */

.dashboard-header h3{

    margin:0;

    font-size:24px;

    font-weight:700;

    letter-spacing:.5px;
}


/* =========================
   LOGOUT BUTTON
========================= */

.dashboard-header .btn-danger{

    border:none!important;

    border-radius:14px!important;

    padding:9px 22px;

    font-weight:600;

    background:
        rgba(255,255,255,.18)!important;

    color:white!important;

    border:1px solid rgba(255,255,255,.35)!important;

    backdrop-filter:blur(10px);

    transition:.3s ease;
}


.dashboard-header .btn-danger:hover{

    background:#ef4444!important;

    transform:translateY(-2px);

    box-shadow:
        0 8px 20px rgba(239,68,68,.30);
}


/* =========================
   CARDS
========================= */

.card{

    height:100%;

    border:none!important;

    border-radius:22px!important;

    overflow:hidden;

    background:
        rgba(255,255,255,.70)!important;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    border:1px solid rgba(255,255,255,.75)!important;

    box-shadow:
        0 10px 28px rgba(15,118,110,.12)!important;

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}


/* Card Hover */

.card:hover{

    transform:translateY(-8px);

    box-shadow:
        0 22px 45px rgba(15,118,110,.20)!important;
}


/* =========================
   CARD IMAGES
========================= */

.card-img-top{

    height:190px;

    object-fit:cover;

    padding:8px;

    border-radius:20px 20px 0 0;

    transition:.4s ease;
}


/* Image hover */

.card:hover .card-img-top{

    transform:scale(1.02);
}


/* =========================
   CARD BODY
========================= */

.card-body{

    padding:20px 18px 22px;

    text-align:center;
}


/* Card Heading */

.card-body h5{

    color:#134e4a;

    font-size:19px;

    font-weight:700;

    margin-bottom:16px;

    letter-spacing:.3px;
}


/* =========================
   ALL OPEN BUTTONS
========================= */

.card .btn{

    border:none!important;

    border-radius:14px!important;

    padding:10px 20px;

    font-weight:600;

    letter-spacing:.2px;

    transition:.3s ease;
}


/* =========================
   PRIMARY - PROFILE
========================= */

.card .btn-primary{

    background:
        linear-gradient(
            135deg,
            #0f766e,
            #14b8a6
        )!important;

    color:white!important;
}


.card .btn-primary:hover{

    transform:translateY(-3px);

    box-shadow:
        0 10px 22px rgba(15,118,110,.28);
}


/* =========================
   SUCCESS - MEDICINE
========================= */

.card .btn-success{

    background:
        linear-gradient(
            135deg,
            #059669,
            #34d399
        )!important;

    color:white!important;
}


.card .btn-success:hover{

    transform:translateY(-3px);

    box-shadow:
        0 10px 22px rgba(5,150,105,.28);
}


/* =========================
   WARNING - EQUIPMENT
========================= */

.card .btn-warning{

    background:
        linear-gradient(
            135deg,
            #d97706,
            #fbbf24
        )!important;

    color:white!important;
}


.card .btn-warning:hover{

    transform:translateY(-3px);

    box-shadow:
        0 10px 22px rgba(217,119,6,.25);
}


/* =========================
   INFO - NGO
========================= */

.card .btn-info{

    background:
        linear-gradient(
            135deg,
            #0f766e,
            #2dd4bf
        )!important;

    color:white!important;
}


.card .btn-info:hover{

    transform:translateY(-3px);

    box-shadow:
        0 10px 22px rgba(20,184,166,.28);
}


/* =========================
   BUTTON PRESS EFFECT
========================= */

.btn:active{

    transform:scale(.97)!important;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

    body{
        padding:10px;
    }

    .container{

        padding:18px;

        border-radius:22px;
    }

    .dashboard-header{

        padding:16px;

    }

    .dashboard-header h3{

        font-size:20px;
    }

    .dashboard-header .btn{

        padding:8px 16px;
    }

    .card-img-top{

        height:180px;
    }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:480px){

    .dashboard-header{

        flex-direction:column;

        gap:15px;

        text-align:center;
    }

    .dashboard-header .btn{

        width:100%;
    }

}

</style>
</head>

<body>

    <div class="container mt-4">

        <div class="dashboard-header d-flex justify-content-between align-items-center">
            <h3>CareVeda - Needy Dashboard</h3>

            <button class="btn btn-danger" onclick="doLogout()">
                Logout
            </button>
        </div>

        <div class="row mt-5 g-4">

            <!-- Profile -->
            <div class="col-md-3">
                <div class="card shadow">
                    <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80"
                        class="card-img-top">

                    <div class="card-body text-center">
                        <h5>My Profile</h5>

                        <a href="/needy-profile" class="btn btn-primary w-100">
                            Open
                        </a>
                    </div>
                </div>
            </div>

            <!-- Medicine Finder -->
            <div class="col-md-3">
                <div class="card shadow">
                    <img src="https://images.unsplash.com/photo-1587854692152-cbe660dbde88"
                        class="card-img-top">

                    <div class="card-body text-center">
                        <h5>Medicine Finder</h5>

                        <a href="/medicine-finder" class="btn btn-success w-100">
                            Open
                        </a>
                    </div>
                </div>
            </div>

            <!-- Equipment Finder -->
            <div class="col-md-3">
                <div class="card shadow">
                    <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d"
                        class="card-img-top">

                    <div class="card-body text-center">
                        <h5>Equipment Finder</h5>

                        <a href="/Equip-finder" class="btn btn-warning w-100">
                            Open
                        </a>
                    </div>
                </div>
            </div>

            <!-- NGO Finder -->
            <div class="col-md-3">
                <div class="card shadow">
                    <img src="https://images.unsplash.com/photo-1488521787991-ed7bbaae773c"
                        class="card-img-top">

                    <div class="card-body text-center">
                        <h5>NGO Finder</h5>

                        <a href="/NGO-finder" class="btn btn-info w-100">
                            Open
                        </a>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
