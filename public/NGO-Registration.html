<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>
        /*   function doShowPrev(fileCtrl, prev) {
               const file = fileCtrl.files[0];
   
               if (file) {
                   prev.src = URL.createObjectURL(file);
               }
           }   */

        function doShowPrev(fileCtrl, prev) {
            const file = fileCtrl.files[0];

            if (file) {

                prev.innerHTML =
                    `<img src="${URL.createObjectURL(file)}"
              class="img-fluid rounded-4"
              style="width:100%;height:100%;object-fit:cover;">`;
            }
        }

    </script>

    <script>
            function setEmail(){
                document.getElementById("Email").value=localStorage.getItem("activeuser");
                document.getElementById("Email").readonly=true;
            }
        </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #ccfbf1, transparent 35%),
                radial-gradient(circle at bottom right, #dbeafe, transparent 35%),
                #f1f8f7;
            padding: 35px 15px;
        }


        /* Main Glass Container */

        .container {
            max-width: 1000px;
            margin: auto;

            background: rgba(255, 255, 255, 0.55);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, .75);

            border-radius: 24px;

            padding: 20px;

            box-shadow:
                0 20px 45px rgba(15, 118, 110, .15);
        }


        /* Heading */

        .bg-warning {
            background: linear-gradient(135deg, #0f766e, #14b8a6) !important;

            color: white !important;

            border-radius: 16px !important;

            padding: 16px !important;

            box-shadow:
                0 10px 25px rgba(15, 118, 110, .25);
        }


        h3 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }


        /* Labels */

        .form-label {
            color: #134e4a;
            font-size: 14px;
            font-weight: 600;
        }


        /* Input Fields */

        .form-control {

            height: 40px;

            border-radius: 14px;

            border: 1px solid rgba(15, 118, 110, .18);

            background: rgba(255, 255, 255, .65);

            backdrop-filter: blur(8px);

            padding: 8px px;

            transition: .3s;

            box-shadow: none !important;
        }


        .form-control::placeholder {
            color: #94a3b8;
        }


        .form-control:focus {

            background: rgba(255, 255, 255, .9);

            border-color: #0f766e;

            box-shadow:
                0 0 0 .18rem rgba(15, 118, 110, .15) !important;
        }


        /* File Upload */

        input[type=file] {

            width: 100%;

            background: rgba(255, 255, 255, .45);

            backdrop-filter: blur(8px);

            border: 2px dashed #8dd3c7;

            border-radius: 14px;

            padding: 10px;
        }


        input[type=file]::file-selector-button {

            background: #0f766e;

            color: white;

            border: none;

            padding: 8px 16px;

            border-radius: 9px;

            margin-right: 10px;

            cursor: pointer;

        }


        /* Image Preview */

        /* =========================================
   NGO Upload Box
========================================= */

label[for="NgoPic"]{
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    width:100%;
}

#prevNGO{

    width:260px !important;
    height:260px !important;

    border-radius:22px !important;

    background:rgba(255,255,255,.55) !important;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    border:2px dashed rgba(15,118,110,.25) !important;

    transition:.35s ease;

    box-shadow:
    0 10px 25px rgba(15,118,110,.10);

    color:#0f766e;

}


/* Hover Effect */

label:hover #prevNGO{

    transform:translateY(-5px);

    border-color:#14b8a6 !important;

    box-shadow:
    0 18px 35px rgba(15,118,110,.18);

    background:rgba(255,255,255,.72) !important;

}


/* Upload Icon */

#prevNGO i{

    font-size:60px !important;

    color:#14b8a6;

    transition:.3s;

}


label:hover #prevNGO i{

    transform:scale(1.1);

    color:#0f766e;

}


/* Upload Heading */

#prevNGO h5{

    font-size:18px;

    font-weight:700;

    color:#134e4a;

    margin-bottom:6px;

}


/* Upload Text */

#prevNGO small{

    font-size:13px;

    color:#6b7280;

    text-align:center;

    padding:0 15px;

}


/* Mobile */

@media(max-width:768px){

    #prevNGO{

        width:220px !important;

        height:220px !important;

    }

    #prevNGO i{

        font-size:50px !important;

    }

}

        /* Button */

        .btn-primary {

            background: #0f766e !important;

            border: none !important;

            border-radius: 14px;

            padding: 11px 38px;

            font-weight: 600;

            transition: .3s;
        }


        .btn-primary:hover {

            background: #115e59 !important;

            transform: translateY(-2px);

            box-shadow:
                0 10px 20px rgba(15, 118, 110, .25);
        }


        /* Spacing */

        .row {
            margin-bottom: 1px;
        }


        @media(max-width:768px) {

            .container {
                padding: 20px;
            }

            #prevNGO {
                height: 220px;
            }

        }
    </style>

</head>

<body onload="setEmail()">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <div class="container border shadow py-2 rounded"> <!--Conatiner DIv jisme sara data bnayenge-->
        <div class="row ">
            <div class="class col-md-12 bg-warning text-center py-2 rounded">
                <h3> NGO REGISTRATION</h3>
            </div>
        </div>
        <form action="/NGO-registration-data-to-server" method="post" enctype="multipart/form-data">

            <div class="row mt-4  ">
                <!--a div which contain image in left side and right div conations email ,med name etc-->
                <div class="class col-md-4"> <!--Div for image uplaod-->

                    <input type="file" id="NgoPic" name="NgoPic" accept="image/*" hidden required
                        onchange="doShowPrev(this,prevNGO)">

                    <label for="NgoPic" style="cursor:pointer;">

                        <div id="prevNGO"
                            class="border rounded-4 shadow-sm d-flex flex-column justify-content-center align-items-center"
                            style="width:300px;height:300px;background:#f8f9fa;">

                            <i class="fa-solid fa-cloud-arrow-up fa-5x text-success mb-3"></i>

                            <h5 class="fw-semibold text-dark mb-1">
                                Upload NGO Image
                            </h5>

                            <small class="text-muted">
                                Click here to choose an image
                            </small>

                        </div>

                    </label>
                    </p>
                </div> <!--image div end-->

                <div class="class col-md-8  p-3"> <!--alg div right side vali-->
                    <div class="row mb-3">
                        <div class="col-md-12 ">
                            <label for="Email" class="form-label">Email</label>
                            <input type="name" class="form-control" id="Email" name="Email">
                        </div>
                    </div>
                    <!-- row 2 for medicine name,expiry date,and company-->
                    <div class="row mb-3">
                        <div class="col-md-5">
                            <label for="medName" class="form-label"> NGO Name</label>
                            <input type="text" class="form-control" id="NGOName" name="NGOName">
                        </div>
                        <div class="col-md-3">
                            <label for="expDate" class="form-label">Registration Office</label>
                            <input type="text" class="form-control" id="Regoffice" name="Regoffice">
                        </div>
                        <div class="col-md-4">
                            <label for="company" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" name="city">
                        </div>
                    </div>
                    <!--3rd row-->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="company" class="form-label">Website</label>
                            <input type="text" class="form-control" id="website" name="website">
                        </div>
                        <div class="col-md-4">
                            <label for="company" class="form-label">Contact Number</label>
                            <input type="text" class="form-control" id="contactNo" name="contactNo">
                        </div>

                        <div class="col-md-6 ">
                            <label for="info" class="form-label">Since</label>
                            <input type="date" class="form-control" id="since" name="since">
                        </div>
                    </div>
                    <!--4th row-->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="company" class="form-label">Chair Person</label>
                            <input type="text" class="form-control" id="chairperson" name="chairperson">
                        </div>
                        <div class="col-md-4">
                            <label for="company" class="form-label">NGO Profile/Works</label>
                            <input type="text" class="form-control" id="NgoWorks" name="NgoWorks">
                        </div>


                    </div>
                    <!--5th row-->
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="company" class="form-label">Registration Number</label>
                            <input type="text" class="form-control" id="RegNO" name="RegNo">
                        </div>
                    </div>
                    <!--Register Now  button div-->
                    <div class="row mt-5">
                        <div class="col-md-6">
                            <center><button type="submit" class="btn btn-primary">Register Now </button></center>
                        </div>
                    </div>
                </div> <!--RIGHT DIV CLOSED-->
            </div> <!--div closed which contain image and right div-->
        </form>
    </div> <!--conatainer div closed-->
</body>

</html>
