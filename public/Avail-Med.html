<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script>
        function doShowPrev(fileCtrl, prev) {
            const file = fileCtrl.files[0];

            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }
    </script>

    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at top left,#ccfbf1,transparent 35%),
    radial-gradient(circle at bottom right,#dbeafe,transparent 35%),
    #f1f8f7;

    min-height:100vh;
    padding:30px 15px;
}

/* Main Container */

.container{

    max-width:1100px;

    background:rgba(255,255,255,.55);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.75);

    border-radius:24px;

    padding:20px;

    box-shadow:
    0 20px 45px rgba(15,118,110,.15);
}

/* Heading */

.bg-warning{

    background:
    linear-gradient(135deg,#0f766e,#14b8a6)!important;

    color:white!important;

    border-radius:16px!important;

    box-shadow:
    0 10px 25px rgba(15,118,110,.25);
}

.bg-warning h3{

    margin:0;

    font-weight:700;

    letter-spacing:1px;
}

/* Labels */

.form-label{

    font-size:14px;

    font-weight:600;

    color:#134e4a;
}

/* Inputs */

.form-control,
.form-select{

    border-radius:14px;

    border:1px solid rgba(15,118,110,.18);

    background:rgba(255,255,255,.7);

    backdrop-filter:blur(8px);

    height:42px;
}

.form-control:focus,
.form-select:focus{

    border-color:#0f766e;

    box-shadow:
    0 0 0 .18rem rgba(15,118,110,.15)!important;
}

/* Upload Box */

input[type=file]{

    width:100%;

    border:2px dashed #8dd3c7;

    border-radius:14px;

    background:rgba(255,255,255,.55);

    padding:10px;
}

input[type=file]::file-selector-button{

    background:#0f766e;

    color:white;

    border:none;

    border-radius:10px;

    padding:8px 16px;

    cursor:pointer;

    margin-right:10px;
}

/* Medicine Preview */

#prevMed{

    width:280px;

    height:280px;

    object-fit:cover;

    border-radius:20px;

    margin-top:15px;

    border:2px dashed rgba(15,118,110,.25);

    background:white;

    box-shadow:
    0 10px 25px rgba(15,118,110,.12);
}

/* Button */

.btn-primary{

    background:#0f766e!important;

    border:none!important;

    border-radius:14px;

    padding:10px 40px;

    font-weight:600;
}

.btn-primary:hover{

    background:#115e59!important;

    transform:translateY(-2px);

    box-shadow:
    0 10px 20px rgba(15,118,110,.25);
}

/* Responsive */

@media(max-width:768px){

    #prevMed{

        width:220px;
        height:220px;
    }

    .container{

        padding:15px;
    }
}
</style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <div class="container border shadow py-2 rounded"> <!--Conatiner DIv jisme sara data bnayenge-->
        <div class="row ">
            <div class="class col-md-12 bg-warning text-center py-2 rounded">
                <h3> Avail Medicine</h3>
            </div>
        </div>
           <form action="/send-AVAIL-MED-data-to-server" method="post" enctype="multipart/form-data">

            <div class="row mt-4  ">
                <!--a div which contain image in left side and right div conations email ,med name etc-->
                <div class="class col-md-4"> <!--Div for image uplaod-->

                    <br>
                    <input type="file" name="medPic" onchange="doShowPrev(this,prev)">
                    <br>
                    <img src="" id="prevMed" alt="" width="300" height="300">
                    </p>
                </div> <!--image div end-->

                <div class="class col-md-8  p-3"> <!--alg div right side vali-->
                    <div class="row mb-3">
                        <div class="col-md-12 ">
                            <label for="Email" class="form-label">Email</label>
                            <input type="name" class="form-control" id="Email" name="Email">
                        </div>
                    </div>
                    <!-- row 2 for medicine name,expiry date,and company-->
                    <div class="row mb-3">
                        <div class="col-md-5">
                            <label for="medName" class="form-label"> Medicine Name</label>
                            <input type="text" class="form-control" id="medName" name="medName">
                        </div>
                        <div class="col-md-3">
                            <label for="expDate" class="form-label">Expiry Date</label>
                            <input type="date" class="form-control" id="expDate" name="expDate">
                        </div>
                        <div class="col-md-4">
                            <label for="company" class="form-label">Company</label>
                            <input type="text" class="form-control" id="company" name="company">
                        </div>
                    </div>
                    <!--3rd row for packing qty and other info-->
                    <div class="row mb-3">
                        <!--packing div-->
                        <div class="col-md-3">
                            <label for="packing" class="form-label"> Pakcing</label>
                            <select class="form-select" name="packing" id="packing">
                                <option selected>Select Packing</option>
                                <option value="Sachet">Sachet</option>
                                <option value="Box">Box</option>
                                <option value="Packet">Packet</option>
                                <option value="Syrup">Syrup</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label for="qty" class="form-label">Quantity</label>
                            <select class="form-select" name="qty" id="qty">
                                <option selected>Select Quantity</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </div>
                        <div class="col-md-6 ">
                            <label for="info" class="form-label">Other Info</label>
                            <input type="text" class="form-control" id="info" name="info">
                        </div>
                    </div>
                    <!--avail button div-->
                    <div class="row mt-5">
                        <div class="col-md-6">
                            <center><button type="submit" class="btn btn-primary">AVail </button></center>
                        </div>
                    </div>
                </div> <!--RIGHT DIV CLOSED-->
            </div> <!--div closed which contain image and right div-->
        </form>
    </div> <!--conatainer div closed-->
</body>

</html>
