<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NGO Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script>
        function doShowPrev(fileCtrl, prev) {
            const file = fileCtrl.files[0];

            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }
    </script>
</head>

<body class="bg-light">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <div class="container py-5">

        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

            <!-- Heading -->
            <div class="bg-primary bg-gradient text-white text-center py-4">
                <h2 class="fw-bold mb-1">NGO REGISTRATION</h2>
                <small class="opacity-75">Register your NGO details below</small>
            </div>

            <div class="card-body p-5">

                <form action="/NGO-registration-data-to-server" method="post" enctype="multipart/form-data">

                    <div class="row g-5">

                        <!-- Image Section -->
                        <div class="col-md-4 text-center border-end">

                            <h5 class="fw-semibold mb-4">
                                NGO Logo
                            </h5>

                            <input class="form-control shadow-sm rounded-3"
                                type="file"
                                name="NgoPic"
                                onchange="doShowPrev(this,prevNGO)">

                            <img src=""
                                id="prevNGO"
                                class="img-fluid rounded-4 shadow mt-4 border"
                                style="height:280px;width:280px;object-fit:cover;"
                                alt="">

                        </div>

                        <!-- Right Side -->
                        <div class="col-md-8">

                            <!-- Email -->
                            <div class="row mb-4">

                                <div class="col-md-12">

                                    <label for="Email"
                                        class="form-label fw-semibold text-secondary">
                                        Email
                                    </label>

                                    <input type="name"
                                        class="form-control form-control-lg shadow-sm rounded-3"
                                        id="Email"
                                        name="Email">

                                </div>

                            </div>

                            <!-- Row 2 -->
                            <div class="row mb-4">

                                <div class="col-md-5">

                                    <label for="medName"
                                        class="form-label fw-semibold text-secondary">
                                        NGO Name
                                    </label>

                                    <input type="text"
                                        class="form-control shadow-sm rounded-3"
                                        id="NGOName"
                                        name="NGOName">

                                </div>

                                <div class="col-md-3">

                                    <label for="expDate"
                                        class="form-label fw-semibold text-secondary">
                                        Registration Office
                                    </label>

                                    <input type="text"
                                        class="form-control shadow-sm rounded-3"
                                        id="Regoffice"
                                        name="Regoffice">

                                </div>

                                <div class="col-md-4">

                                    <label for="company"
                                        class="form-label fw-semibold text-secondary">
                                        City
                                    </label>

                                    <input type="text"
                                        class="form-control shadow-sm rounded-3"
                                        id="city"
                                        name="city">

                                </div>

                            </div>

                            <!-- Row 3 -->

                            <div class="row mb-4">

                                <div class="col-md-4">

                                    <label class="form-label fw-semibold text-secondary">
                                        Website
                                    </label>

                                    <input type="text"
                                        class="form-control shadow-sm rounded-3"
                                        id="website"
                                        name="website">

                                </div>

                                <div class="col-md-4">

                                    <label class="form-label fw-semibold text-secondary">
                                        Contact Number
                                    </label>

                                    <input type="text"
                                        class="form-control shadow-sm rounded-3"
                                        id="contactNo"
                                        name="contactNo">

                                </div>

                                <div class="col-md-4">

                                    <label class="form-label fw-semibold text-secondary">
                                        Since
                                    </label>

                                    <input type="date"
                                        class="form-control shadow-sm rounded-3"
                                        id="since"
                                        name="since">

                                </div>

                            </div>

                            <!-- Row 4 -->

                            <div class="row mb-4">

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold text-secondary">
                                        Chair Person
                                    </label>

                                    <input type="text"
                                        class="form-control shadow-sm rounded-3"
                                        id="chairperson"
                                        name="chairperson">

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold text-secondary">
                                        NGO Profile / Works
                                    </label>

                                    <input type="text"
                                        class="form-control shadow-sm rounded-3"
                                        id="NgoWorks"
                                        name="NgoWorks">

                                </div>

                            </div>

                            <!-- Row 5 -->

                            <div class="row mb-4">

                                <div class="col-md-6">

                                    <label class="form-label fw-semibold text-secondary">
                                        Registration Number
                                    </label>

                                    <input type="text"
                                        class="form-control shadow-sm rounded-3"
                                        id="RegNO"
                                        name="RegNo">

                                </div>

                            </div>

                            <hr class="my-4">

                            <!-- Button -->

                            <div class="text-center">

                                <button type="submit"
                                    class="btn btn-primary btn-lg rounded-pill px-5 shadow">

                                    Register Now

                                </button>

                            </div>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
