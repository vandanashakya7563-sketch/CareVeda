<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#ccfbf1,transparent 35%),
        radial-gradient(circle at bottom right,#dbeafe,transparent 35%),
        #f1f8f7;
    padding:35px 15px;
}

.container{
    max-width:900px;
    margin:auto;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.75)!important;
    border-radius:24px;
    padding:20px;
    box-shadow:0 20px 45px rgba(15,118,110,.15);
}

.bg-warning{
    background:linear-gradient(135deg,#0f766e,#14b8a6)!important;
    color:white!important;
    border-radius:16px!important;
    box-shadow:0 10px 25px rgba(15,118,110,.25);
}

.form-label{
    color:#134e4a;
    font-weight:600;
    font-size:14px;
}

.form-control{
    height:42px;
    border-radius:14px;
    border:1px solid rgba(15,118,110,.18);
    background:rgba(255,255,255,.65);
    backdrop-filter:blur(8px);
    transition:.3s;
}

.form-control:focus{
    border-color:#0f766e;
    box-shadow:0 0 0 .18rem rgba(15,118,110,.15)!important;
}

input[type=file]{
    width:100%;
    background:rgba(255,255,255,.45);
    border:2px dashed #8dd3c7;
    border-radius:14px;
    padding:10px;
}

input[type=file]::file-selector-button{
    background:#0f766e;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:10px;
    cursor:pointer;
    margin-right:10px;
}

img{
    margin-top:10px;
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:16px;
    border:3px solid rgba(15,118,110,.15);
    box-shadow:0 8px 20px rgba(15,118,110,.12);
}

.btn-primary{
    background:#0f766e!important;
    border:none!important;
    border-radius:14px;
    padding:11px 35px;
    font-weight:600;
}

.btn-primary:hover{
    background:#115e59!important;
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(15,118,110,.25);
}

.row{
    margin-bottom:8px;
}

@media(max-width:768px){

    .container{
        padding:15px;
    }

    img{
        width:110px;
        height:110px;
    }
}
</style>
    <script>
        function doShowPrev(fileCtrl, prev) {
            const file = fileCtrl.files[0];

            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }
    </script>

     <script>
            function setEmail(){
                document.getElementById("txtEmail").value=localStorage.getItem("activeuser");
                document.getElementById("txtEmail").readonly=true;
            }
        </script>

</head>

<body onload="setEmail()">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <div class="container border shadow py-2 rounded">
        <div class="row ">
            <div class="class col-md-12 bg-warning text-center py-2 rounded">
                NEEDY PROFILE
            </div>
        </div>
        <form action="/ai-read-pic" method="post" enctype="multipart/form-data">
            <div class="row g-3 ">
                <div class="col-md-6">
                    <label for="Email" class="form-label">Email</label>
                    <input type="name" class="form-control" id="txtEmail" name="txtEmail">
                </div>
                <div class="col-md-6">
                    <label for="mobileNUM" class="form-label">Mobile Number</label>
                    <input type="text" class="form-control" id="mobile" name="mobile">
                </div>
            </div>

  
    <div class="row mt-4">
        <div class="class col-4">
            Adhar Card Front Pic:
            <br>
            <input type="file" name="apicf" onchange="doShowPrev(this,prevpic1)">
            <br>
            <img src="" id="prevpic1" alt="" width="100" height="100">
            </p>
        </div>
        <div class="class col-4">
            Rear Pic:
            <br>
            <input type="file" name="apicr" onchange="doShowPrev(this,prevpic2)">
            <br>
            <img src="" id="prevpic2" alt="" width="100" height="100">
            </p>
        </div>
    </div>
    
    <div class="row mt-2">
        <div class="col-6">
            <center><button type="submit" class="btn btn-primary">Upload Details </button></center>
        </div>

    </div>
    </form>
    </div>


</body>

</html>
