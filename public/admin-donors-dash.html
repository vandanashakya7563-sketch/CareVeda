<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<style>
    /* =========================
   BODY
========================= */

body{
    font-family:'Inter',sans-serif;

    background:
    radial-gradient(circle at top left,#ccfbf1,transparent 35%),
    radial-gradient(circle at bottom right,#dbeafe,transparent 35%),
    #eef8f6;

    min-height:100vh;
    padding:25px;
}

/* =========================
   PAGE TITLE
========================= */

h3{

    display:inline-block;

    background:linear-gradient(
    135deg,
    #0f766e,
    #14b8a6
    );

    color:white;

    padding:14px 30px;

    border-radius:18px;

    font-weight:700;

    letter-spacing:.5px;

    margin-bottom:25px;

    box-shadow:
    0 10px 25px rgba(15,118,110,.25);
}

/* =========================
   TABLE
========================= */

.table{

    background:rgba(255,255,255,.72);

    backdrop-filter:blur(18px);

    border-radius:22px;

    overflow:hidden;

    box-shadow:
    0 12px 30px rgba(15,118,110,.12);

    border:none;
}

.table th{

    background:linear-gradient(
    135deg,
    #0f766e,
    #14b8a6
    ) !important;

    color:white !important;

    text-align:center;

    vertical-align:middle;

    border:none !important;

    padding:14px;
}

.table td{

    text-align:center;

    vertical-align:middle;

    background:rgba(255,255,255,.55);

    border-color:rgba(15,118,110,.08);

    padding:12px;
}

.table-hover tbody tr:hover{

    background:rgba(20,184,166,.08);
}

/* =========================
   IMAGES
========================= */

.table img{

    width:60px;
    height:60px;

    object-fit:cover;

    border-radius:12px;

    border:2px solid rgba(15,118,110,.15);

    box-shadow:
    0 6px 15px rgba(15,118,110,.12);
}

/* =========================
   DELETE BUTTON
========================= */

.btn-danger{

    background:linear-gradient(
    135deg,
    #ef4444,
    #f87171
    ) !important;

    border:none !important;

    border-radius:12px !important;

    padding:8px 18px !important;

    font-weight:600;

    transition:.3s;
}

.btn-danger:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 20px rgba(239,68,68,.25);
}

/* =========================
   TABLE CONTAINER
========================= */

.table{

    width:95%;
    margin:auto;
}
</style>
