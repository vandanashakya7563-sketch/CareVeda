<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    /* =========================
   BODY
========================= */

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;

    background:
    radial-gradient(circle at top left,#ccfbf1,transparent 35%),
    radial-gradient(circle at bottom right,#dbeafe,transparent 35%),
    #f1f8f7;

    padding:25px;
}

/* =========================
   NAVBAR
========================= */
/* ==========================
   ADMIN NAVBAR
========================== */

.admin-nav{

    background:
    linear-gradient(
    135deg,
    #0f766e,
    #14b8a6
    );

    padding:12px 0;

    border-radius:0 0 20px 20px;

    box-shadow:
    0 10px 30px rgba(15,118,110,.25);

}

.dashboard-title{

    color:white;

    font-size:22px;

    font-weight:700;

    letter-spacing:1px;

}

.navbar-brand{

    letter-spacing:.5px;

}

.navbar-brand i{

    color:white;

}

.navbar-toggler{

    border:none;

}

.navbar-toggler:focus{

    box-shadow:none;

}

.admin-nav .btn-light{

    background:rgba(255,255,255,.9);

    color:#0f766e;

    font-weight:600;

    border:none;

    transition:.3s;

}

.admin-nav .btn-light:hover{

    background:white;

    transform:translateY(-2px);

    box-shadow:
    0 10px 20px rgba(255,255,255,.25);

}

/* =========================
   CARDS
========================= */

.card{
    border:none !important;

    border-radius:24px;

    background:rgba(255,255,255,.75);

    backdrop-filter:blur(18px);

    box-shadow:
    0 15px 35px rgba(15,118,110,.10);

    transition:.3s;

    padding:20px;
}

.card:hover{
    transform:translateY(-8px);

    box-shadow:
    0 25px 40px rgba(15,118,110,.18);
}

/* =========================
   ICONS
========================= */

.card i{
    color:#0f766e;

    margin-top:20px;
    margin-bottom:15px;

    transition:.3s;
}

.card:hover i{
    transform:scale(1.1);
}

/* =========================
   BUTTONS
========================= */

.btn-primary{

    background:linear-gradient(
    135deg,
    #0f766e,
    #14b8a6
    ) !important;

    border:none !important;

    border-radius:14px;

    padding:10px 20px;

    font-weight:600;

    width:100%;
}

.btn-primary:hover{

    transform:translateY(-2px);

    box-shadow:
    0 12px 25px rgba(15,118,110,.25);
}

/* =========================
   CARD TITLE LOOK
========================= */

.card-body{
    padding-top:10px;
}

/* =========================
   ROW SPACING
========================= */

.row{
    row-gap:20px;
}

/* =========================
   SEARCH BOX
========================= */

.form-control{
    border-radius:14px;

    border:1px solid rgba(15,118,110,.15);
}

.form-control:focus{
    border-color:#14b8a6;

    box-shadow:
    0 0 0 .18rem rgba(20,184,166,.15);
}
</style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<nav class="navbar navbar-expand-lg admin-nav shadow-sm">

    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold text-white fs-4" href="#">
            <i class="fa-solid fa-heart-circle-plus me-2"></i>
            CareVeda
        </a>

        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
            id="navbarContent">

            <div class="mx-auto">
                <span class="dashboard-title">
                    Admin Dashboard
                </span>
            </div>

            <div class="d-flex align-items-center">

                <span class="text-white me-3 fw-semibold">
                    Welcome Admin
                </span>

                <a href="/"
                    class="btn btn-light rounded-pill px-4">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>
                    Logout
                </a>

            </div>

        </div>

    </div>

</nav>

    <div class="row"> <!--------------------------ROW 1--------------------->
        <div class="col-md-3">
            <!-----bootstrap-->
            <div class="card text-center mb-3">

                <i class="fa-solid fa-address-card fa-5x "></i>
                <div class="card-body">

                    <a href="/Admin-User-dashboard" class="btn btn-primary">Admin User Dashboard</a>
                </div>
            </div>
        </div>

         <div class="col-md-3">
            <!-----bootstrap-->
            <div class="card text-center mb-3">

                <i class="fa-solid fa-address-card fa-5x "></i>
                <div class="card-body">

                    <a href="/Admin-Donors-dashboard" class="btn btn-primary">Admin Donor Dashboard</a>
                </div>
            </div>
        </div>

         <div class="col-md-3">
            <!-----bootstrap-->
            <div class="card text-center mb-3">

                <i class="fa-solid fa-address-card fa-5x "></i>
                <div class="card-body">

                    <a href="/All-medicines" class="btn btn-primary">All Medicines</a>
                </div>
            </div>
        </div>

        
    </div>
</body>

</html>
