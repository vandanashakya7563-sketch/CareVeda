<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#ccfbf1,transparent 35%),
        radial-gradient(circle at bottom right,#dbeafe,transparent 35%),
        #f1f8f7;
    padding:25px 15px;
}

.container-fluid.bg-success{
    background:linear-gradient(135deg,#0f766e,#14b8a6)!important;
    color:white;
    border-radius:18px;
    max-width:1400px;
    margin:auto;
    box-shadow:0 10px 25px rgba(15,118,110,.25);
}

.container{
    max-width:1400px;
}

/* Cards */

.card{
    border:none;
    border-radius:20px;
    overflow:hidden;
    background:rgba(255,255,255,.65);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    transition:.3s;
    box-shadow:
    0 10px 25px rgba(15,118,110,.10);
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:
    0 20px 35px rgba(15,118,110,.18);
}

.card-img-top{
    height:220px !important;
    object-fit:cover;
}

.card-body{
    text-align:center;
}

.card-text{
    font-weight:600;
    color:#134e4a;
    min-height:50px;
}

/* Buttons */

.btn-outline-primary{
    border-radius:12px;
    border:1px solid #0f766e;
    color:#0f766e;
    font-weight:600;
}

.btn-outline-primary:hover{
    background:#0f766e;
    border-color:#0f766e;
}

/* Modal */

.modal-content{
    border:none !important;
    border-radius:22px !important;
    overflow:hidden;
}

.modal-header{
    background:linear-gradient(135deg,#0f766e,#14b8a6)!important;
}

.modal-title{
    color:white;
}

.table{
    margin-bottom:0;
}

.table th{
    background:#f0fdfa;
    color:#134e4a;
    width:35%;
}

.table td{
    background:white;
}

/* Medicine Image */

.modal-body img{
    border-radius:16px !important;
}

/* Scroll */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#14b8a6;
    border-radius:20px;
}

@media(max-width:768px){

    .card-img-top{
        height:180px !important;
    }

    .modal-body img{
        width:180px !important;
        height:180px !important;
        margin-bottom:15px;
    }
}
</style>

    <script>
        let myModule = angular.module("moduleKuch", []);
        let mycontroller = myModule.controller("controllerKuch", function ($scope, $http) {

            $scope.doShowAllMedData = function () {
                let url = "/fetch-all-medicine-data";
                $http.get(url).then(function (resp) {
                    //alert(JSON.stringify(resp.data))
                    $scope.jsonAry = (resp.data);
                }, function (resp) {
                    alert(err);
                });
            }

            $scope.doViewDetail = function (rid) {
                let url = "/fetch-med-Detail-in-view-details?ridKuch=" + rid;
                $http.get(url).then(function (resp) {

                    $scope.oneMed = resp.data[0];

                }, function (resp) {
                    alert(err);
                });
            }

        });

    </script>
</head>

<body ng-app="moduleKuch" ng-controller="controllerKuch" ng-init="doShowAllMedData()">


    <div class="container-fluid bg-success py-3 shadow-sm mb-4">

        <h2 class="text-center  fw-bold mb-0">
            <i class="fa-solid fa-capsules"></i>Available Medicines
        </h2>
    </div>

    <div class="container">
        <div class="row g-3">

            <div class="col-md-3" ng-repeat="obj in jsonAry">
                <!---------------card----------->
                <div class="card">
                    <img src="{{obj.medpicURL}}" class="card-img-top" alt="..." width="100" height="100">
                    <div class="card-body">

                        <p class="card-text"> {{obj.medname}}</p>

                        <!-- Button trigger modal -->
                        <a href="#" ng-click="doViewDetail(obj.r_ID)" data-bs-toggle="modal"
                            data-bs-target="#medicineModal" class="btn btn-outline-primary">View Details</a>


                    </div>
                </div>
                <!--Modal card k bahr lagana h kyoki card me ng-repeat lga hua hh-->
                <!--------------------------- Modal -->
                <div class="modal fade" id="medicineModal" tabindex="-1">
                    <div class="modal-dialog modal-lg modal-dialog-centered">
                        <div class="modal-content shadow-lg border-0 rounded-4">

                            <!-- Header -->
                            <div class="modal-header bg-success text-white">
                                <h4 class="modal-title fw-bold">
                                    Medicine Details
                                </h4>

                                <button type="button" class="btn-close btn-close-white"
                                    data-bs-dismiss="modal"></button>
                            </div>

                            <!-- Body -->
                            <div class="modal-body">

                                <div class="row">

                                    <!-- Medicine Image -->
                                    <div class="col-md-4 text-center">
                                        <img src="{{oneMed.medpicURL}}" class="img-fluid rounded shadow border"
                                            style="height:220px;width:220px;">
                                    </div>

                                    <!-- Details -->
                                    <div class="col-md-8">

                                        <table class="table table-bordered">

                                            <tr>
                                                <th>Donor Email</th>
                                                <td>{{oneMed.email}}</td>
                                            </tr>

                                            <tr>
                                                <th width="35%">Medicine Name</th>
                                                <td>{{oneMed.medname}}</td>
                                            </tr>

                                            <tr>
                                                <th>Company</th>
                                                <td>{{oneMed.company}}</td>
                                            </tr>

                                            <tr>
                                                <th>Packing</th>
                                                <td>{{oneMed.packing}}</td>
                                            </tr>

                                            <tr>
                                                <th>Quantity</th>
                                                <td>{{oneMed.qty}}</td>
                                            </tr>

                                            <tr>
                                                <th>Expiry Date</th>
                                                <td>{{oneMed.expdate}}</td>
                                            </tr>

                                            <tr>
                                                <th>Other Information</th>
                                                <td>{{oneMed.info}}</td>
                                            </tr>



                                        </table>

                                    </div>

                                </div>

                            </div>

                            <!-- Footer -->
                            <div class="modal-footer">
                                <button class="btn btn-secondary" data-bs-dismiss="modal">
                                    Close
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
                <!--modal khtm-->
            </div>
        </div>

    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
